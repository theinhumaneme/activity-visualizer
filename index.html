<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Activity Viz" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn any GPX or TCX activity into a 3D flyover, a full analysis, and a shareable video. Files never leave your device." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <!-- Map styles, vector tiles and glyphs come from OpenFreeMap: open the connection early. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <title>Activity Visualizer</title>
    <script>
      // Apply a saved light/dark choice before first paint.
      try {
        var t = localStorage.getItem("rv:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
